name: Publish to Pub.dev

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: publish-pub-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for pub.dev OIDC authentication
  contents: write # Required for creating GitHub Releases

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Dart & Pub.dev OIDC
        uses: dart-lang/setup-dart@v1

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap Monorepo Dependencies
        run: melos bootstrap

      - name: Static Code Analysis
        run: melos exec -- dart analyze .

      - name: Run Unit Tests
        run: melos exec --dir-exists="test" -- flutter test

      - name: Configure Pub.dev Credentials (Secret Fallback)
        run: |
          if [ -n "$PUB_DEV_TOKEN" ]; then
            echo "Configuring pub.dev authentication via token"
            dart pub token add https://pub.dev --env-var PUB_DEV_TOKEN
          elif [ -n "$PUB_DEV_CREDENTIALS" ]; then
            echo "Configuring pub.dev authentication via legacy credentials"
            mkdir -p ~/.config/dart
            echo "$PUB_DEV_CREDENTIALS" > ~/.config/dart/pub-tokens.json
          fi
        env:
          PUB_DEV_TOKEN: ${{ secrets.PUB_DEV_PUBLISH_TOKEN || secrets.PUB_DEV_TOKEN }}
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}

      - name: Publish to Pub.dev
        run: |
          TAG="${{ github.ref_name }}"
          echo "Triggered by tag: $TAG"

          if [[ "$TAG" == *"-v"* ]]; then
            PKG_NAME="${TAG%-v*}"
            echo "Publishing package: $PKG_NAME"
            melos publish --scope="$PKG_NAME" --no-dry-run --yes --no-git-tag-version
          else
            echo "Publishing all unpublished packages in dependency order"
            melos publish --no-dry-run --no-published --no-private --yes --no-git-tag-version
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Processing GitHub Release for tag: $TAG"

          if [[ "$TAG" == *"-v"* ]]; then
            PKG_NAME="${TAG%-v*}"
            PKG_VER="${TAG##*-v}"
            CHANGELOG_PATH="packages/$PKG_NAME/CHANGELOG.md"
            NOTES=""
            if [ -f "$CHANGELOG_PATH" ]; then
              NOTES=$(python3 -c "import sys, re; path, ver = sys.argv[1], sys.argv[2]; c = open(path).read(); m = re.search(rf'##\s+{re.escape(ver)}\s*\n(.*?)(?=\n##\s+|\Z)', c, re.DOTALL); print(m.group(1).strip() if m else '')" "$CHANGELOG_PATH" "$PKG_VER")
            fi

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release for $TAG already exists, skipping."
            elif [ -n "$NOTES" ]; then
              gh release create "$TAG" --title "$PKG_NAME v$PKG_VER" --notes "$NOTES"
            else
              gh release create "$TAG" --title "$PKG_NAME v$PKG_VER" --generate-notes
            fi
          elif [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
            NOTES=$(python3 -c "import glob, os, sys, re; ver = sys.argv[1]; all_notes = [f'### {os.path.basename(os.path.dirname(p))}\n\n' + m.group(1).strip() for p in sorted(glob.glob('packages/*/CHANGELOG.md')) for m in [re.search(rf'##\s+{re.escape(ver)}\s*\n(.*?)(?=\n##\s+|\Z)', open(p).read(), re.DOTALL)] if m and m.group(1).strip()]; print('\n\n'.join(all_notes))" "$VER")

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release for $TAG already exists, skipping."
            elif [ -n "$NOTES" ]; then
              gh release create "$TAG" --title "Release v$VER" --notes "$NOTES"
            else
              gh release create "$TAG" --title "Release v$VER" --generate-notes
            fi
          fi


