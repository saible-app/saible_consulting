name: Publish to Pub.dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: publish-pub-dev
  cancel-in-progress: false

permissions:
  id-token: write # Required for pub.dev OIDC authentication
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Dart & Pub.dev OIDC
        uses: dart-lang/setup-dart@v1

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap Monorepo Dependencies
        run: melos bootstrap

      - name: Static Code Analysis
        run: melos exec -- dart analyze .

      - name: Run Unit Tests
        run: melos exec --dir-exists="test" -- flutter test

      - name: Configure Pub.dev Credentials (Secret Fallback)
        run: |
          if [ -n "$PUB_DEV_TOKEN" ]; then
            echo "Configuring pub.dev authentication via token"
            dart pub token add https://pub.dev --env-var PUB_DEV_TOKEN
          elif [ -n "$PUB_DEV_CREDENTIALS" ]; then
            echo "Configuring pub.dev authentication via legacy credentials"
            mkdir -p ~/.config/dart
            echo "$PUB_DEV_CREDENTIALS" > ~/.config/dart/pub-tokens.json
          fi
        env:
          PUB_DEV_TOKEN: ${{ secrets.PUB_DEV_PUBLISH_TOKEN || secrets.PUB_DEV_TOKEN }}
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}

      - name: Dry-Run Publication Validation
        run: melos publish --dry-run --no-published --no-private --yes

      - name: Publish Packages to Pub.dev
        run: melos publish --no-dry-run --no-published --no-private --yes --no-git-tag-version
