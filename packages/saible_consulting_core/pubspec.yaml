version: 0.0.1
repository: https://github.com/saible-app/saible_consulting.git

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  collection: ^1.19.1
  dlibphonenumber: ^1.1.71
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.4.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter packages.
flutter:
  generate: true

resolution: workspace
